#
# Crowdin CLI configuration
# https://crowdin.github.io/crowdin-cli/configuration
#
# Credentials are read from the environment when available:
#   CROWDIN_PROJECT_ID=945897
#   CROWDIN_PERSONAL_TOKEN=...
#
# The GitHub Actions workflow (.github/workflows/crowdin.yml) supplies both
# from repository secrets. For local runs, export them in your shell or let
# mise inject them from .env.
#

project_id: "945897"
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: "."
base_url: "https://api.crowdin.com"

preserve_hierarchy: true

#
# Only export target locales supported by the application. The Crowdin project
# also has an `en` target language, which is redundant with the `en` source
# locale; excluding it here keeps download commands from overwriting
# messages/en.json and src/routes/docs/src/*.md.
#
export_languages:
  - af
  - ar
  - ca
  - cs
  - da
  - de
  - el
  - es-ES
  - fi
  - fr
  - he
  - hu
  - it
  - ja
  - ko
  - nl
  - no
  - pl
  - pt-BR
  - pt-PT
  - ro
  - ru
  - sr
  - sv-SE
  - tr
  - uk
  - vi
  - zh-CN
  - zh-TW

files:
  #
  # UI messages consumed by native i18n ($lib/i18n).
  #
  # `%locale%` is used instead of `%two_letters_code%` because the
  # two-letter placeholder collapses every language that shares a code:
  # pt-PT/pt-BR both become `pt` and zh-CN/zh-TW both become `zh`, and the
  # CLI silently drops one of each pair. `%locale%` keeps all 29 targets
  # distinct, and `languages_mapping` renames each one to the locale code
  # expected by the app. Keys are Crowdin language ids, not locales: Serbian
  # is `sr` even though `%locale%` renders `sr-SP`.
  #
  - source: /messages/en.json
    translation: /messages/%locale%.json
    type: json
    update_option: update_as_unapproved
    skip_untranslated_strings: true
    excluded_target_languages:
      - en
    languages_mapping:
      locale:
        af: af
        ar: ar
        ca: ca
        cs: cs
        da: da
        de: de
        el: el
        es-ES: es
        fi: fi
        fr: fr
        he: he
        hu: hu
        it: it
        ja: ja
        ko: ko
        nl: nl
        no: no
        pl: pl
        pt-BR: pt-BR
        pt-PT: pt
        ro: ro
        ru: ru
        sr: sr
        sv-SE: sv
        tr: tr
        uk: uk
        vi: vi
        zh-CN: zh-CN
        zh-TW: zh-TW

  #
  # Docs are loaded by src/lib/server/docs.ts. Files in a locale folder
  # (<locale>/<name>.md) override the English source with the same slug.
  #
  # `fm_md` is Front Matter Markdown: Crowdin parses the YAML front matter
  # instead of treating it as body text. In the Crowdin file settings,
  # exclude the structural keys (slug, serial, weight, date, preview,
  # badge, draft, isCJKLanguage, headless, tags) from translation so the
  # loader keeps resolving the same slug and metadata for every locale.
  # Translate only title, description, keywords, and section.
  #
  - source: /src/routes/docs/src/*.md
    translation: /src/routes/docs/src/%locale%/%original_file_name%
    type: fm_md
    update_option: update_as_unapproved
    skip_untranslated_files: true
    excluded_target_languages:
      - en
    ignore:
      - /src/routes/docs/src/*/**/*.md
    languages_mapping:
      locale:
        af: af
        ar: ar
        ca: ca
        cs: cs
        da: da
        de: de
        el: el
        es-ES: es
        fi: fi
        fr: fr
        he: he
        hu: hu
        it: it
        ja: ja
        ko: ko
        nl: nl
        no: no
        pl: pl
        pt-BR: pt-BR
        pt-PT: pt
        ro: ro
        ru: ru
        sr: sr
        sv-SE: sv
        tr: tr
        uk: uk
        vi: vi
        zh-CN: zh-CN
        zh-TW: zh-TW
